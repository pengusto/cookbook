name: Check skill and site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python3 scripts/project.py check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: private-review-package
          path: dist/site
          retention-days: 14
